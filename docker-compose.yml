services:
  postgres:
    image: postgres:16-alpine
    container_name: oriontek-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oriontek}
      POSTGRES_USER: ${POSTGRES_USER:-oriontek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oriontek}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oriontek} -d ${POSTGRES_DB:-oriontek}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oriontek-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oriontek-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oriontek}
      DB_USERNAME: ${POSTGRES_USER:-oriontek}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oriontek}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-a-demo-secret-key-min-256-bits-long}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - oriontek-net

volumes:
  postgres_data:

networks:
  oriontek-net:
    driver: bridge
